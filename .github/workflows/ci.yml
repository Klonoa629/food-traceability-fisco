name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 合约测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      # types/artifacts 不入库，测试前需编译生成 TypeChain 类型
      - run: npm run compile
      - run: npm test
      # 依赖漏洞扫描：仅告警不阻断
      - run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew test --no-daemon
      # 镜像构建冒烟：Dockerfile 损坏时尽早暴露
      - run: docker compose build
        working-directory: deploy

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # 浏览器依赖隔离在 runner 临时目录，不进入应用运行依赖。
      - name: 准备浏览器回归环境
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save --no-package-lock --ignore-scripts playwright-core@1.64.0
          node "$RUNNER_TEMP/browser-qa/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: 文件核验与质检页面回归
        run: npm run test:browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-qa/node_modules/playwright-core
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/foodtrace-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression
          path: ${{ runner.temp }}/foodtrace-e2e
          if-no-files-found: ignore
