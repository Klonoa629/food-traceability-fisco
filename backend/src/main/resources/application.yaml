server:
  port: 8081
  address: 0.0.0.0

fisco:
  cert-path: conf
  group-id: group0
  peers: 127.0.0.1:20200

webase:
  sign-url: http://127.0.0.1:5004/WeBASE-Sign
  app-id: foodtrace

foodtrace:
  contract-address: "0x2af6160e266f763652f433a80b94fc13f4065303"
  # 角色对账周期（毫秒），默认 10 分钟
  reconcile-interval-ms: 600000
  # 产品读缓存存活时间（毫秒），默认 1 分钟
  product-cache-ttl-ms: 60000
  jwt:
    secret: "${FOODTRACE_JWT_SECRET}"
    ttl-minutes: 120

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/foodtrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "${FOODTRACE_DB_PASSWORD}"