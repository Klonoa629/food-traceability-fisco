server:
  port: 8081
  address: 0.0.0.0
  shutdown: graceful

fisco:
  cert-path: conf
  group-id: group0
  peers: ${FISCO_PEERS:127.0.0.1:20200}

webase:
  sign-url: ${WEBASE_SIGN_URL:http://127.0.0.1:5004/WeBASE-Sign}
  app-id: foodtrace

foodtrace:
  contract-address: "${FOODTRACE_CONTRACT_ADDRESS:0x2af6160e266f763652f433a80b94fc13f4065303}"
  # 合约事件订阅（外部交易的缓存失效与审计）
  event-subscribe: true
  # 角色对账周期（毫秒），默认 10 分钟
  reconcile-interval-ms: 600000
  # 产品读缓存存活时间（毫秒），默认 1 分钟
  product-cache-ttl-ms: 60000
  # 存证对象存储（MinIO）
  storage:
    endpoint: ${FOODTRACE_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${FOODTRACE_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${FOODTRACE_STORAGE_SECRET_KEY:minioadmin}
    bucket: foodtrace-evidence
  # 审计锚定合约地址（空则不锚定）
  anchor-address: "${FOODTRACE_ANCHOR_ADDRESS:}"
  # 审计锚定周期（毫秒），默认 10 分钟
  anchor-interval-ms: 600000
  # 审计完整性定时校验周期（毫秒），默认 10 分钟
  verify-interval-ms: 600000
  jwt:
    secret: "${FOODTRACE_JWT_SECRET}"
    ttl-minutes: 120

spring:
  application:
    name: foodtrace-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/foodtrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "${FOODTRACE_DB_PASSWORD}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # 探针供容器与负载均衡使用；明细不对外
      probes:
        enabled: true
      show-details: never