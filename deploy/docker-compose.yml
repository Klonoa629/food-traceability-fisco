services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ../backend
    environment:
      FOODTRACE_JWT_SECRET: ${FOODTRACE_JWT_SECRET}
      FOODTRACE_DB_PASSWORD: ${FOODTRACE_DB_PASSWORD}
      FOODTRACE_TRUSTED_PROXIES: ${FOODTRACE_WEB_IP:-172.30.0.10}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      WEBASE_SIGN_URL: ${WEBASE_SIGN_URL:-http://host.docker.internal:5004/WeBASE-Sign}
      FISCO_PEERS: ${FISCO_PEERS:-host.docker.internal:20200}
      FOODTRACE_STORAGE_ENDPOINT: ${FOODTRACE_STORAGE_ENDPOINT:-http://minio:9000}
      FOODTRACE_STORAGE_ACCESS_KEY: ${FOODTRACE_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      FOODTRACE_STORAGE_SECRET_KEY: ${FOODTRACE_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      FOODTRACE_CONTRACT_ADDRESS: ${FOODTRACE_CONTRACT_ADDRESS:-0x2af6160e266f763652f433a80b94fc13f4065303}
      FOODTRACE_ANCHOR_ADDRESS: ${FOODTRACE_ANCHOR_ADDRESS:-}
      FOODTRACE_DB_BASELINE: ${FOODTRACE_DB_BASELINE:-false}
      FOODTRACE_DB_BASELINE_VERSION: ${FOODTRACE_DB_BASELINE_VERSION:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SDK 证书不入库，运行时从宿主目录挂载（应用内路径 fisco.cert-path=conf）
      - ../backend/conf:/app/conf:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 35s
    depends_on:
      minio:
        condition: service_healthy

  web:
    build: ../frontend
    networks:
      default:
        ipv4_address: ${FOODTRACE_WEB_IP:-172.30.0.10}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${FOODTRACE_SUBNET:-172.30.0.0/24}
