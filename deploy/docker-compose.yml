services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ../backend
    environment:
      FOODTRACE_JWT_SECRET: ${FOODTRACE_JWT_SECRET}
      FOODTRACE_DB_PASSWORD: ${FOODTRACE_DB_PASSWORD}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      WEBASE_SIGN_URL: ${WEBASE_SIGN_URL:-http://host.docker.internal:5004/WeBASE-Sign}
      FISCO_PEERS: ${FISCO_PEERS:-host.docker.internal:20200}
      FOODTRACE_STORAGE_ENDPOINT: ${FOODTRACE_STORAGE_ENDPOINT:-http://minio:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 35s
    depends_on:
      minio:
        condition: service_healthy

  web:
    build: ../frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  minio-data:
  prometheus-data:
  grafana-data:
